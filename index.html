<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHOI HANBIN — Space Archive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f3ef;
    color: #2a2825;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
  }

  #canvas-wrap {
    position: fixed;
    inset: 0;
    cursor: grab;
  }
  #canvas-wrap:active { cursor: grabbing; }
  #canvas-wrap.fps-mode { cursor: none; }

  canvas { display: block; width: 100% !important; height: 100% !important; }

  #hud-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 28px 36px;
    pointer-events: none;
    z-index: 10;
  }

  .hud-name {
    font-size: 11px;
    letter-spacing: 0.22em;
    color: rgba(42,40,37,0.5);
    text-transform: uppercase;
  }
  .hud-sub {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(42,40,37,0.25);
    margin-top: 4px;
    text-transform: uppercase;
  }

  .hud-right { text-align: right; }

  #hud-bottom {
    position: fixed;
    bottom: 28px;
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 36px;
    pointer-events: none;
    z-index: 10;
  }

  .hint {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: rgba(42,40,37,0.25);
    text-transform: uppercase;
    line-height: 1.8;
  }

  #loading {
    position: fixed;
    inset: 0;
    background: #f5f3ef;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.8s ease;
  }
  #loading.fade { opacity: 0; pointer-events: none; }

  .loading-name {
    font-size: 13px;
    letter-spacing: 0.35em;
    color: rgba(42,40,37,0.5);
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .loading-bar-wrap {
    width: 180px;
    height: 1px;
    background: rgba(42,40,37,0.1);
    overflow: hidden;
  }
  .loading-bar {
    height: 100%;
    background: rgba(42,40,37,0.4);
    width: 0%;
    transition: width 0.3s ease;
  }

  .loading-pct {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(42,40,37,0.25);
    margin-top: 14px;
    text-align: center;
  }

  #controls {
    position: fixed;
    right: 36px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }

  .ctrl-btn {
    width: 36px;
    height: 36px;
    background: rgba(42,40,37,0.05);
    border: 0.5px solid rgba(42,40,37,0.15);
    color: rgba(42,40,37,0.4);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
    font-family: 'Courier New', monospace;
    border-radius: 2px;
  }
  .ctrl-btn:hover {
    background: rgba(42,40,37,0.1);
    color: rgba(42,40,37,0.8);
  }

  #coords {
    font-size: 9px;
    letter-spacing: 0.12em;
    color: rgba(42,40,37,0.18);
    line-height: 1.8;
    font-variant-numeric: tabular-nums;
  }

  #crosshair {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 12px;
    height: 12px;
    pointer-events: none;
    z-index: 20;
    display: none;
  }
  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: rgba(42,40,37,0.4);
  }
  #crosshair::before { width: 1px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
  #crosshair::after { width: 100%; height: 1px; top: 50%; left: 0; transform: translateY(-50%); }
  #crosshair.visible { display: block; }

  #click-hint {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(42,40,37,0.3);
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.3s;
  }

  .star-btn {
    position: fixed;
    width: 12px;
    height: 12px;
    cursor: pointer;
    z-index: 15;
    transform: translate(-50%, -50%);
    background: none;
    border: none;
    padding: 0;
    animation: starBlink 0.8s ease-in-out infinite;
  }
  .star-btn svg {
    width: 12px;
    height: 12px;
    overflow: visible;
  }

  @keyframes starBlink {
    0%, 35%, 100% {
      opacity: 1;
      filter: drop-shadow(0 0 8px rgba(255,255,255,1)) drop-shadow(0 0 16px rgba(255,255,255,0.8)) drop-shadow(0 0 30px rgba(255,255,255,0.6));
    }
    50%, 70% {
      opacity: 0;
      filter: none;
    }
  }

  .info-panel {
    position: fixed;
    top: 20%;
    right: 90px;
    left: auto;
    width: 456px;
    height: 645px;
    max-width: calc(100vw - 120px);
    max-height: calc(100vh - 40px);
    background: transparent;
    border: none;
    z-index: 20;
    display: none;
    overflow: hidden;
    box-shadow: none;
  }
  .info-panel.visible { display: block; }
  .info-panel img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
  }
</style>
</head>
<body>

<div id="loading">
  <p class="loading-name">CHOI HANBIN</p>
  <div class="loading-bar-wrap">
    <div class="loading-bar" id="bar"></div>
  </div>
  <p class="loading-pct" id="pct">0%</p>
</div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
</div>

<div id="hud-top">
  <div>
    <div class="hud-name">CHOI HANBIN</div>
    <div class="hud-sub">Printmaking × Space × Interaction</div>
  </div>
  <div class="hud-right" id="coords">

  <div class="hint" style="text-align:right">

  <button class="ctrl-btn" id="btn-zoom-in" title="줌인">+</button>

  <button class="ctrl-btn" id="btn-top" title="위에서 보기">↑</button>
  <button class="ctrl-btn" id="btn-front" title="정면 보기">→</button>
</div>

<div id="crosshair"></div>
<div id="click-hint">CLICK TO ENTER SPACE</div>

<!-- 흰색 별 (전시배치도) -->
<button id="star-btn1" class="star-btn">
  <svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">
    <polygon points="5,0 6.2,3.8 10,3.8 7,6.2 8.1,10 5,7.8 1.9,10 3,6.2 0,3.8 3.8,3.8"
      fill="#ffffff" stroke="#ffffff" stroke-width="0.5"/>
  </svg>
</button>

<!-- 노란색 별 (작가 정보) -->
<button id="star-btn2" class="star-btn">
  <svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">
    <polygon points="5,0 6.2,3.8 10,3.8 7,6.2 8.1,10 5,7.8 1.9,10 3,6.2 0,3.8 3.8,3.8"
      fill="#FFE600" stroke="none"/>
  </svg>
</button>

<!-- 전시배치도 패널 -->
<div id="map-panel" class="info-panel">
  <img src="map.kor.jpg" alt="전시 배치도">
</div>

<!-- 작가 정보 패널 -->
<div id="artist-panel" class="info-panel">
  <img src="artistinfo.kor.jpg" alt="작가 정보">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f3ef);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0, 2, 6);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;

const ambient = new THREE.AmbientLight(0xfff8f0, 0.9);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffeedd, 0.5);
dirLight.position.set(3, 5, 3);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0xddeeff, 0.25);
dirLight2.position.set(-3, 2, -2);
scene.add(dirLight2);

let model = null;
let center = new THREE.Vector3();
let modelRadius = 3;

const DEFAULT_VIEW = { theta: 1.878, phi: 1.15, r: 7.2 };
const DEFAULT_PAN = { x: -0.5, y: -1.4, z: 0 };

const manager = new THREE.LoadingManager();
const bar = document.getElementById('bar');
const pct = document.getElementById('pct');
manager.onProgress = (url, loaded, total) => {
  const p = Math.round(loaded / total * 100);
  bar.style.width = p + '%';
  pct.textContent = p + '%';
};
manager.onLoad = () => {
  setTimeout(() => {
    document.getElementById('loading').classList.add('fade');
  }, 400);
};

async function loadGLB(url) {
  const res = await fetch(url);
  const buffer = await res.arrayBuffer();
  const dv = new DataView(buffer);
  const length = dv.getUint32(8, true);
  let jsonStr = '';
  let binBuffer = null;
  let offset = 12;
  while (offset < length) {
    const chunkLen = dv.getUint32(offset, true);
    const chunkType = dv.getUint32(offset + 4, true);
    const chunkData = buffer.slice(offset + 8, offset + 8 + chunkLen);
    if (chunkType === 0x4E4F534A) jsonStr = new TextDecoder().decode(chunkData);
    else if (chunkType === 0x004E4942) binBuffer = chunkData;
    offset += 8 + chunkLen;
  }
  bar.style.width = '60%'; pct.textContent = '60%';
  const gltf = JSON.parse(jsonStr);
  const bin = binBuffer;
  const bvs = gltf.bufferViews;
  const accs = gltf.accessors;
  function getAccessorData(accIdx) {
    const acc = accs[accIdx];
    const bv = bvs[acc.bufferView];
    const byteOffset = (bv.byteOffset || 0) + (acc.byteOffset || 0);
    const count = acc.count;
    const ct = acc.componentType;
    const type = acc.type;
    const comps = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4 }[type];
    const total = count * comps;
    const slice = bin.slice(byteOffset, byteOffset + total * (ct === 5126 ? 4 : ct === 5123 ? 2 : 1));
    if (ct === 5126) return new Float32Array(slice);
    if (ct === 5123) return new Uint16Array(slice);
    if (ct === 5121) return new Uint8Array(slice);
    return null;
  }
  bar.style.width = '75%'; pct.textContent = '75%';
  const prim = gltf.meshes[0].primitives[0];
  const positions = getAccessorData(prim.attributes.POSITION);
  const normals = prim.attributes.NORMAL !== undefined ? getAccessorData(prim.attributes.NORMAL) : null;
  const uvs = prim.attributes.TEXCOORD_0 !== undefined ? getAccessorData(prim.attributes.TEXCOORD_0) : null;
  const indices = getAccessorData(prim.indices);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  if (normals) geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  if (uvs) geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setIndex(new THREE.BufferAttribute(indices, 1));
  if (!normals) geo.computeVertexNormals();
  bar.style.width = '88%'; pct.textContent = '88%';
  let mat;
  if (gltf.materials && gltf.images && uvs) {
    const imgInfo = gltf.images[0];
    const bv = bvs[imgInfo.bufferView];
    const imgData = bin.slice(bv.byteOffset, bv.byteOffset + bv.byteLength);
    const blob = new Blob([imgData], { type: imgInfo.mimeType || 'image/jpeg' });
    const imgUrl = URL.createObjectURL(blob);
    const tex = await new Promise((res, rej) => {
      const loader = new THREE.TextureLoader();
      loader.load(imgUrl, t => { t.encoding = THREE.sRGBEncoding; t.flipY = false; res(t); }, undefined, rej);
    });
    mat = new THREE.MeshStandardMaterial({ map: tex, side: THREE.DoubleSide, roughness: 0.7, metalness: 0 });
  } else {
    mat = new THREE.MeshStandardMaterial({ color: 0xc8bfac, side: THREE.DoubleSide });
  }
  const mesh = new THREE.Mesh(geo, mat);
  const node = gltf.nodes[0];
  if (node.rotation) {
    const [rx, ry, rz, rw] = node.rotation;
    mesh.quaternion.set(rx, ry, rz, rw);
  }
  mesh.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), Math.PI / 4 + 0.175);
  geo.computeBoundingBox();
  geo.boundingBox.getCenter(center);
  mesh.position.sub(center);
  const size = new THREE.Vector3();
  geo.boundingBox.getSize(size);
  modelRadius = Math.max(size.x, size.y, size.z) * 0.5;
  bar.style.width = '100%'; pct.textContent = '100%';
  return mesh;
}

// 별 버튼 & 패널
const starPos3D1 = new THREE.Vector3(1.490, 1.516, 1.755);
const starPos3D2 = new THREE.Vector3(1.276, 1.487, 1.780);
const starBtn1 = document.getElementById('star-btn1');
const starBtn2 = document.getElementById('star-btn2');
const mapPanel = document.getElementById('map-panel');
const artistPanel = document.getElementById('artist-panel');

starBtn1.addEventListener('mouseenter', () => { mapPanel.classList.add('visible'); });
starBtn1.addEventListener('mouseleave', () => { mapPanel.classList.remove('visible'); });
starBtn1.addEventListener('click', e => { e.stopPropagation(); });

starBtn2.addEventListener('mouseenter', () => { artistPanel.classList.add('visible'); });
starBtn2.addEventListener('mouseleave', () => { artistPanel.classList.remove('visible'); });
starBtn2.addEventListener('click', e => { e.stopPropagation(); });

loadGLB('myspacescan.glb').then(mesh => {
  model = mesh;
  scene.add(mesh);
  camera.position.set(0, modelRadius * 0.4, modelRadius * 2.2);
  camera.lookAt(0, 0, 0);
  targetPos.copy(camera.position);

  const axisLength = modelRadius * 2;
  const xGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-axisLength,0,0), new THREE.Vector3(axisLength,0,0)]);
  scene.add(new THREE.Line(xGeo, new THREE.LineBasicMaterial({ color: 0xff4444, transparent: true, opacity: 0.4 })));
  const yGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-axisLength,0), new THREE.Vector3(0,axisLength,0)]);
  scene.add(new THREE.Line(yGeo, new THREE.LineBasicMaterial({ color: 0x44ff44, transparent: true, opacity: 0.4 })));
  const zGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,-axisLength), new THREE.Vector3(0,0,axisLength)]);
  scene.add(new THREE.Line(zGeo, new THREE.LineBasicMaterial({ color: 0x4444ff, transparent: true, opacity: 0.4 })));

  manager.onLoad();
}).catch(err => {
  console.error(err);
  pct.textContent = '파일 로드 오류';
});

let isFPSMode = false;
fpsYaw = Math.PI;
let fpsPitch = 0;
const fpsSpeed = 0.05;
const keys = {};

const wrap = document.getElementById('canvas-wrap');
const crosshair = document.getElementById('crosshair');
const clickHint = document.getElementById('click-hint');
const hintLeft = document.getElementById('hint-left');

wrap.addEventListener('click', e => {
  if (starBtn1.contains(e.target) || starBtn2.contains(e.target)) return;
  if (!isFPSMode) wrap.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === wrap) {
    isFPSMode = true;
    wrap.classList.add('fps-mode');
    crosshair.classList.add('visible');
    clickHint.style.opacity = '0';
    hintLeft.innerHTML = 'WASD — MOVE<br>MOUSE — LOOK<br>ESC — EXIT';
    fpsYaw = 0;
    fpsPitch = 0;
    camera.rotation.set(0, 0, 0);
  } else {
    isFPSMode = false;
    wrap.classList.remove('fps-mode');
    crosshair.classList.remove('visible');
    clickHint.style.opacity = '1';
    hintLeft.innerHTML = 'drag — rotate<br>scroll — zoom<br>right drag — pan<br>click — enter space';
    const pos = camera.position;
    spherical.r = pos.length();
    spherical.phi = Math.acos(Math.min(1, pos.y / spherical.r));
    spherical.theta = Math.atan2(pos.x, pos.z);
    targetSpherical = { ...spherical };
  }
});

document.addEventListener('mousemove', e => {
  if (!isFPSMode) return;
  fpsYaw -= e.movementX * 0.002;
  fpsPitch -= e.movementY * 0.002;
  fpsPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, fpsPitch));
});

window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

let isDragging = false;
let isRightDrag = false;
let prevMouse = { x: 0, y: 0 };
let spherical = { ...DEFAULT_VIEW };
let targetSpherical = { ...DEFAULT_VIEW };
let panOffset = new THREE.Vector3(DEFAULT_PAN.x, DEFAULT_PAN.y, DEFAULT_PAN.z);
let targetPan = new THREE.Vector3(DEFAULT_PAN.x, DEFAULT_PAN.y, DEFAULT_PAN.z);
let targetPos = new THREE.Vector3();

wrap.addEventListener('mousedown', e => {
  if (isFPSMode) return;
  isDragging = true;
  isRightDrag = e.button === 2;
  prevMouse = { x: e.clientX, y: e.clientY };
});
wrap.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('mousemove', e => {
  if (isFPSMode || !isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  prevMouse = { x: e.clientX, y: e.clientY };
  if (isRightDrag) {
    const panSpeed = 0.005 * targetSpherical.r;
    const right = new THREE.Vector3();
    const up = new THREE.Vector3();
    camera.getWorldDirection(up);
    right.crossVectors(up, camera.up).normalize();
    targetPan.addScaledVector(right, -dx * panSpeed);
    targetPan.y += dy * panSpeed;
  } else {
    targetSpherical.theta -= dx * 0.008;
    targetSpherical.phi -= dy * 0.008;
    targetSpherical.phi = Math.max(0.05, Math.min(Math.PI - 0.05, targetSpherical.phi));
  }
});

window.addEventListener('mouseup', () => { isDragging = false; });

wrap.addEventListener('wheel', e => {
  if (isFPSMode) return;
  e.preventDefault();
  targetSpherical.r *= (1 + e.deltaY * 0.001);
  targetSpherical.r = Math.max(modelRadius * 0.3, Math.min(modelRadius * 5, targetSpherical.r));
}, { passive: false });

let lastTouch = null;
wrap.addEventListener('touchstart', e => {
  lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
wrap.addEventListener('touchmove', e => {
  if (isFPSMode) return;
  e.preventDefault();
  const dx = e.touches[0].clientX - lastTouch.x;
  const dy = e.touches[0].clientY - lastTouch.y;
  lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  targetSpherical.theta -= dx * 0.01;
  targetSpherical.phi -= dy * 0.01;
  targetSpherical.phi = Math.max(0.05, Math.min(Math.PI - 0.05, targetSpherical.phi));
}, { passive: false });

document.getElementById('btn-zoom-in').addEventListener('click', () => {
  if (isFPSMode) return;
  targetSpherical.r = Math.max(modelRadius * 0.3, targetSpherical.r * 0.8);
});
document.getElementById('btn-zoom-out').addEventListener('click', () => {
  if (isFPSMode) return;
  targetSpherical.r = Math.min(modelRadius * 5, targetSpherical.r * 1.25);
});
document.getElementById('btn-reset').addEventListener('click', () => {
  if (isFPSMode) return;
  targetSpherical = { ...DEFAULT_VIEW };
  targetPan.set(DEFAULT_PAN.x, DEFAULT_PAN.y, DEFAULT_PAN.z);
});
document.getElementById('btn-top').addEventListener('click', () => {
  if (isFPSMode) return;
  targetSpherical.phi = 0.1;
  targetSpherical.theta = 0;
});
document.getElementById('btn-front').addEventListener('click', () => {
  if (isFPSMode) return;
  targetSpherical.phi = Math.PI / 2;
  targetSpherical.theta = 0;
});

const raycaster = new THREE.Raycaster();
const mouse2 = new THREE.Vector2();
wrap.addEventListener('click', e => {
  if (!e.shiftKey) return;
  if (isFPSMode) return;
  mouse2.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse2.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse2, camera);
  if (model) {
    const hits = raycaster.intersectObject(model, true);
    if (hits.length > 0) {
      const p = hits[0].point;
      alert(`x=${p.x.toFixed(3)}, y=${p.y.toFixed(3)}, z=${p.z.toFixed(3)}`);
    }
  }
});

const coordsEl = document.getElementById('coords');
const fpsForward = new THREE.Vector3();
const fpsRight = new THREE.Vector3();
const fpsUp = new THREE.Vector3(0, 1, 0);

function animate() {
  requestAnimationFrame(animate);

  if (isFPSMode) {
    camera.rotation.order = 'YXZ';
    camera.rotation.y = fpsYaw;
    camera.rotation.x = fpsPitch;
    camera.getWorldDirection(fpsForward);
    fpsForward.y = 0;
    fpsForward.normalize();
    fpsRight.crossVectors(fpsForward, fpsUp).normalize();
    if (keys['KeyW'] || keys['ArrowUp'])    camera.position.addScaledVector(fpsForward, fpsSpeed);
    if (keys['KeyS'] || keys['ArrowDown'])  camera.position.addScaledVector(fpsForward, -fpsSpeed);
    if (keys['KeyA'] || keys['ArrowLeft'])  camera.position.addScaledVector(fpsRight, -fpsSpeed);
    if (keys['KeyD'] || keys['ArrowRight']) camera.position.addScaledVector(fpsRight, fpsSpeed);
    coordsEl.innerHTML =
      `POS ${camera.position.x.toFixed(1)} ${camera.position.y.toFixed(1)} ${camera.position.z.toFixed(1)}<br>FPS MODE`;
  } else {
    spherical.theta += (targetSpherical.theta - spherical.theta) * 0.08;
    spherical.phi += (targetSpherical.phi - spherical.phi) * 0.08;
    spherical.r += (targetSpherical.r - spherical.r) * 0.08;
    panOffset.lerp(targetPan, 0.08);
    const x = spherical.r * Math.sin(spherical.phi) * Math.sin(spherical.theta);
    const y = spherical.r * Math.cos(spherical.phi);
    const z = spherical.r * Math.sin(spherical.phi) * Math.cos(spherical.theta);
    camera.position.set(x + panOffset.x, y + panOffset.y, z + panOffset.z);
    camera.lookAt(panOffset);
    camera.rotation.order = 'XYZ';
    coordsEl.innerHTML =
      `ROT ${(spherical.theta * 57.3).toFixed(1)}° ${(spherical.phi * 57.3).toFixed(1)}° —<br>` +
      `ZOOM ${spherical.r.toFixed(2)}m`;
  }

  // 별1 위치 추적
  const sp1 = starPos3D1.clone().project(camera);
  starBtn1.style.left = ((sp1.x * 0.5 + 0.5) * window.innerWidth) + 'px';
  starBtn1.style.top = ((-sp1.y * 0.5 + 0.5) * window.innerHeight) + 'px';
  const sd1 = camera.position.distanceTo(starPos3D1);
  starBtn1.style.transform = `translate(-50%, -50%) scale(${Math.max(0.5, Math.min(2, 8 / sd1))})`;

  // 별2 위치 추적
  const sp2 = starPos3D2.clone().project(camera);
  starBtn2.style.left = ((sp2.x * 0.5 + 0.5) * window.innerWidth) + 'px';
  starBtn2.style.top = ((-sp2.y * 0.5 + 0.5) * window.innerHeight) + 'px';
  const sd2 = camera.position.distanceTo(starPos3D2);
  starBtn2.style.transform = `translate(-50%, -50%) scale(${Math.max(0.5, Math.min(2, 8 / sd2))})`;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
