<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHOI HANBIN — Works</title>
<link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scrollbar-width: none;
  }
  html::-webkit-scrollbar {
    display: none;
  }

  body {
    background: linear-gradient(to top, rgba(255,255,44,0.7) 0%, rgba(255,255,255,0.5) 60%);
    color: #2a2825;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  #back-btn {
    position: fixed;
    top: 28px;
    left: 36px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(42,40,37,0.4);
    background: rgba(42,40,37,0.05);
    border: 0.5px solid rgba(42,40,37,0.15);
    padding: 8px 14px;
    cursor: pointer;
    text-transform: uppercase;
    z-index: 100;
    border-radius: 2px;
    transition: background 0.2s, color 0.2s;
  }
  #back-btn:hover {
    background: rgba(42,40,37,0.1);
    color: rgba(42,40,37,0.8);
  }

  #custom-scrollbar {
    position: fixed;
    right: 20px;
    top: 0;
    width: 74px;
    height: 100vh;
    z-index: 100;
    pointer-events: none;
  }

  #scroll-thumb {
    position: absolute;
    right: 0;
    width: 74px;
    height: calc(100vh / 6);
    cursor: grab;
    pointer-events: auto;
    user-select: none;
  }
  #scroll-thumb:active { cursor: grabbing; }
  #scroll-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }

  #content {
    max-width: 1512px;
    margin: 0 auto;
    padding: 100px 120px 200px;
  }

  .section-label {
    display: inline-block;
    font-family: 'Inconsolata', monospace;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: rgba(42,40,37,0.6);
    border: 0.5px solid rgba(42,40,37,0.3);
    padding: 4px 12px;
    margin-bottom: 48px;
    text-transform: lowercase;
  }

  .section {
    margin-bottom: 160px;
  }

  .placeholder {
    width: 100%;
    background: rgba(42,40,37,0.04);
    border: 0.5px dashed rgba(42,40,37,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: rgba(42,40,37,0.25);
    text-transform: uppercase;
  }

  .placeholder-tall { height: 600px; }
  .placeholder-mid { height: 400px; }
  .placeholder-short { height: 200px; }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  @keyframes slideLeft {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
<body>

<button id="back-btn" onclick="window.location.href='index.html'">← back</button>

<div id="custom-scrollbar">
  <div id="scroll-thumb">
    <img src="scroll.png" alt="scroll">
  </div>
</div>

<div id="content">

  <!-- ARTWORKS 섹션 -->
  <div class="section" id="section-artworks">

    <!-- 영상 풀너비 -->
    <div style="margin-left: -120px; margin-right: -120px;">
      <iframe width="100%" height="600"
        src="https://www.youtube.com/embed/YwqzBa2-cmY?start=1&end=20&loop=1&playlist=YwqzBa2-cmY&autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&showinfo=0"
        frameborder="0" allowfullscreen>
      </iframe>
    </div>

    <!-- 슬라이드 풀너비 -->
    <div style="margin-left: -120px; margin-right: -120px; overflow: hidden; margin-top: 24px;">
      <div style="display: flex; gap: 16px; animation: slideLeft 20s linear infinite; width: max-content;">
        <img src="p1.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p2.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p3.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p4.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p5.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p6.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p7.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p1.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p2.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p3.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p4.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p5.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p6.jpg" style="height: 300px; width: auto; object-fit: cover;">
        <img src="p7.jpg" style="height: 300px; width: auto; object-fit: cover;">
      </div>
    </div>

    <div class="grid-3" style="margin-top: 48px;">
      <div class="placeholder placeholder-mid">작품 사진</div>
      <div class="placeholder placeholder-mid">작품 사진</div>
      <div class="placeholder placeholder-mid">작품 사진</div>
    </div>
    <div class="grid-2" style="margin-top: 16px;">
      <div class="placeholder placeholder-short">텍스트</div>
      <div class="placeholder placeholder-short">텍스트</div>
    </div>
    <div class="placeholder placeholder-tall" style="margin-top: 48px;">
      PIXEL GACHA — 추가 예정
    </div>
  </div>

  <!-- SPATIAL DESIGN 섹션 -->
  <div class="section" id="section-spatial">
    <span class="section-label">spatial design</span>

    <div class="placeholder placeholder-tall" style="margin-bottom: 16px;">
      전시 사진 — 추가 예정
    </div>
    <div class="grid-2">
      <div class="placeholder placeholder-mid">전시 사진</div>
      <div class="placeholder placeholder-mid">전시 사진</div>
    </div>
    <div class="placeholder placeholder-mid" style="margin-top: 16px;">
      작품 설명 — 추가 예정
    </div>
  </div>

  <!-- ABOUT & ARCHIVE 섹션 -->
  <div class="section" id="section-about">
    <span class="section-label">about & archive</span>

    <div class="grid-2">
      <div class="placeholder placeholder-tall">프로필 사진</div>
      <div class="placeholder placeholder-tall">텍스트 — 추가 예정</div>
    </div>
  </div>

</div>

<script>
  const thumb = document.getElementById('scroll-thumb');
  const thumbHeight = window.innerHeight / 6;

  function updateThumb() {
    const scrollTop = window.scrollY;
    const maxScroll = document.body.scrollHeight - window.innerHeight;
    const maxThumbTop = window.innerHeight - thumbHeight;
    const thumbTop = maxScroll > 0 ? (scrollTop / maxScroll) * maxThumbTop : 0;
    thumb.style.top = thumbTop + 'px';
  }

  window.addEventListener('scroll', updateThumb);
  updateThumb();

  let isDragging = false;
  let startY = 0;
  let startScrollY = 0;

  thumb.addEventListener('mousedown', e => {
    isDragging = true;
    startY = e.clientY;
    startScrollY = window.scrollY;
    e.preventDefault();
  });

  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dy = e.clientY - startY;
    const maxScroll = document.body.scrollHeight - window.innerHeight;
    const maxThumbTop = window.innerHeight - thumbHeight;
    const scrollDelta = (dy / maxThumbTop) * maxScroll;
    window.scrollTo(0, startScrollY + scrollDelta);
  });

  window.addEventListener('mouseup', () => { isDragging = false; });

  // 해시로 섹션 이동
  window.addEventListener('load', () => {
    const hash = window.location.hash;
    if (hash) {
      const el = document.querySelector(hash);
      if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth' }), 100);
    }
  });
</script>
</body>
</html>
